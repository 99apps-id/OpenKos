[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS
pcov.directory = .
memory_limit = 512M

; -----------------------------------------------------------------------------
; Security Hardening: CVE-2026-109618 & CVE-2026-109619 (PHP2Shell Mitigation)
; -----------------------------------------------------------------------------
; Disabling session upload progress closes the unserializer use-after-free
; vulnerability in the PHP engine triggered by multipart/form-data payloads.
session.upload_progress.enabled = Off
session.upload_progress.cleanup = On
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
session.upload_progress.freq = "1%"
session.upload_progress.min_freq = "1"

; Prevent unexpected fatal-error memory exhaustion cycles
max_execution_time = 60
